<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vouch</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/dashboard" class="brand"><img src="logo.png" alt="Vouch" class="logo-img"></a>
    <nav class="tabs" id="tabs" hidden>
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/search" data-tab="search">Search</a>
      <a href="#/upload" data-tab="upload">Upload</a>
      <a href="#/health" data-tab="health">Health</a>
      <a href="#/eval" data-tab="eval">Test Agent</a>
    </nav>
    <div class="controls" hidden>
      <label>Company <select id="company"></select></label>
      <label>Reference date <input type="date" id="peildatum"></label>
      <div class="userline"><span id="userbox"></span><button type="button" id="logout" class="ghost small-btn">Sign out</button></div>
    </div>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <dialog id="dialog"></dialog>

  <script src="app.js"></script>
</body>
</html>
